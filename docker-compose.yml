services:

  web:
    build: .
    container_name: job_tracker_web
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: job_tracker_db
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: job_tracker
      POSTGRES_PASSWORD: job_tracker_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: